<style>
  :root{
    --paper:#ffffff; --ink:#17171d; --muted:#6c6c78; --line:#e8e8ee;
    --navy:#213a63; --navy-2:#2f5089; --wash:#f3f5fb;
    --green:#177a4b; --green-soft:#eaf6ef; --green-line:#bfe3cd;

  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
    padding-bottom:64px;}
  .wrap{max-width:840px;margin:0 auto;padding:0 18px}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);

  .hd{max-width:840px;margin:0 auto;padding:12px 18px 0}
  .hd-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:.02em;color:var(--navy);font-size:18px}
  .brand small{font-weight:600;color:var(--muted);font-size:12.5px;letter-spacing:0}
  .hd-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .prog{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .prog b{color:var(--green);font-weight:700}
  .warnchip{border:1px solid var(--red-line);background:var(--red-soft);color:var(--red);
    font-weight:700;font-size:12.5px;border-radius:999px;padding:5px 11px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;line-height:1}
  .warnchip:hover{background:#fbe3df}
  .warnchip .dot{width:7px;height:7px;border-radius:50%;background:var(--red)}

  nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{appearance:none;border:0;background:none;font-family:inherit;font-size:14.5px;
    font-weight:600;color:var(--muted);padding:9px 13px 12px;cursor:pointer;white-space:nowrap;
    border-bottom:2.5px solid transparent;position:relative;top:1px}
  .tab .sub{font-size:11px;color:#a6a6b2;font-weight:600;margin-left:5px}
  .tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
  .tab:hover{color:var(--ink)}

  main{padding-top:18px}
  .view{display:none;animation:fade .18s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view,.view.on{animation:none}}

  /* deck toolbar */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .deckname{font-weight:700;color:var(--ink);font-size:15px}
  .deckname span{color:var(--muted);font-weight:600;font-size:13px;margin-left:4px}
  .tools{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
  .ghost{appearance:none;font-family:inherit;font-size:13px;font-weight:600;

  .ghost.act{border-color:var(--navy);color:var(--navy);background:var(--wash)}

  /* card */

    box-shadow:var(--shadow);padding:22px 22px 20px;min-height:220px;

  .card-meta{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .idx{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}

  .state-badge.again{background:var(--amber-soft);color:var(--amber)}
  .qhead{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9a9aa6;margin:6px 0 2px}
  .qtitle{font-size:19px;font-weight:750;color:var(--ink);line-height:1.4;margin:2px 0 4px}

  /* koujue hero */

    background:#fff;color:var(--navy);font-weight:800;font-size:26px;line-height:1;
    padding:11px 13px;border-radius:11px;transition:all .12s ease;letter-spacing:.02em}

  .ku-char[aria-expanded="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .ku-dot{color:#b9c0d6;font-weight:700;font-size:20px;user-select:none}

  .ku-means{margin-top:11px;display:flex;flex-direction:column;gap:0}

  .reveal-btn{appearance:none;font-family:inherit;font-size:15px;font-weight:700;

  .reveal-btn.open{background:#fff;color:var(--navy)}

  .tip{margin-top:12px;font-size:14px;color:#7a5a12;background:var(--amber-soft);

  .tip b{color:var(--amber)}
  b.hot{color:var(--red);font-weight:800;background:var(--red-soft);
    border-radius:4px;padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  b.good{color:var(--green);font-weight:800;background:var(--green-soft);

  .marks{display:flex;gap:9px;margin-top:16px}
  .mk{appearance:none;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;

    line-height:1.55;color:#1e1e2a}
  ol.gold li::before{content:counter(g);position:absolute;left:12px;top:11px;
    width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;
    font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  ol.gold li b{color:var(--navy)}
  .resc{padding:11px 0;border-bottom:1px dashed var(--line)}
  .resc:last-child{border-bottom:0}
  .resc .when{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .resc .en{font-family:var(--serif);font-size:15px;color:#1c1c28;line-height:1.6}
  .rev-q{font-family:var(--serif);font-size:15px;color:#1c1c28;padding:9px 0;
    border-bottom:1px dashed var(--line)}
  .rev-q:last-child{border-bottom:0}

  .prin:last-child{border-bottom:0}

  .prin .v{font-size:14.5px;color:#3a3a44}

  .howto{font-size:13px;color:var(--muted);text-align:center;margin:20px 0 4px;line-height:1.7}
  .howto kbd{font-family:var(--sans);font-size:11.5px;background:#f2f2f6;border:1px solid #e0e0e8;
    border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:#4a4a56;font-weight:600}
  footer{text-align:center;color:#a6a6b2;font-size:12px;padding:24px 0 8px}
  footer b{color:var(--navy)}
</style>

<script>
"use strict";
/* ---------- safe inline markup: **navy** [[red]] {{green}} ---------- */
function md(str, parent){
  const re=/(\*\*.+?\*\*|\[\[.+?\]\]|\{\{.+?\}\})/g;
  let last=0,m;
  while((m=re.exec(str))!==null){
    if(m.index>last) parent.appendChild(document.createTextNode(str.slice(last,m.index)));
    const tok=m[0]; const inner=tok.slice(2,-2); const b=document.createElement("b");
    if(tok.startsWith("**")) b.className="nv";
    else if(tok.startsWith("[[")) b.className="hot";
    else b.className="good";
    b.textContent=inner; parent.appendChild(b); last=re.lastIndex;
  }
  if(last<str.length) parent.appendChild(document.createTextNode(str.slice(last)));
}
function para(html,cls){const p=document.createElement("p");if(cls)p.className=cls;md(html,p);return p;}

  b.innerHTML=`${t.label}<span class="sub">${t.sub}</span>`;
  b.addEventListener("click",()=>switchView(t.id));
  tabsEl.appendChild(b);
});

function switchView(v){
  activeView=v;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===v?"true":"false"));
  document.querySelectorAll(".view").forEach(el=>el.classList.remove("on"));
  document.getElementById("view-"+v).classList.add("on");
  if(v==="ref") renderRef(); else renderDeck(v);
  window.scrollTo({top:0,behavior:"instant" in window?"instant":"auto"});
}

/* ---------- ids per deck ---------- */
function cardId(deck,i){return deck+":"+i;}
function deckItems(deck){
  if(deck==="koujue")return DECKS.koujue.keys.map(k=>({key:k}));
  if(deck==="qa")return QA;
  if(deck==="code")return CODE;
  if(deck==="num")return NUM;
  return [];
}
function visibleIndexes(deck){
  const order=rt[deck].order||[...Array(deckItems(deck).length).keys()];
  if(!rt[deck].onlyAgain)return order.slice();
  const f=order.filter(i=>getState(cardId(deck,i))==="again");
  return f.length?f:order.slice(); /* if none marked again, show all */
}

/* ---------- render a drill deck ---------- */
function renderDeck(deck){
  const host=document.getElementById("view-"+deck);
  host.innerHTML="";
  const meta=DECKS[deck];
  const vis=visibleIndexes(deck);
  const st=rt[deck];
  if(st.i>=vis.length)st.i=0;

  /* toolbar */
  const tb=document.createElement("div");tb.className="toolbar";
  const dn=document.createElement("div");dn.className="deckname";
  dn.innerHTML=`${meta.name} <span>${meta.sub}</span>`;
  tb.appendChild(dn);
  const tools=document.createElement("div");tools.className="tools";
  const okc=countState(deck,"ok"),agc=countState(deck,"again");
  const stat=document.createElement("span");stat.className="ghost";stat.style.cursor="default";
  stat.innerHTML=`✓ ${okc} · ↻ ${agc}`;
  const bAgain=document.createElement("button");bAgain.className="ghost"+(st.onlyAgain?" act":"");
  bAgain.textContent=st.onlyAgain?"看全部":"只练再练";
  bAgain.addEventListener("click",()=>{st.onlyAgain=!st.onlyAgain;st.i=0;st.revealed=false;renderDeck(deck);});
  const bShuf=document.createElement("button");bShuf.className="ghost";bShuf.textContent="打乱";
  bShuf.addEventListener("click",()=>{shuffle(deck);renderDeck(deck);});
  const bReset=document.createElement("button");bReset.className="ghost";bReset.textContent="重置进度";
  bReset.addEventListener("click",()=>{
    if(confirm("清空「"+meta.name+"」的会了/再练标记？")){
      deckItems(deck).forEach((_,i)=>delete progress[cardId(deck,i)]);
      saveProg();updateGlobal();renderDeck(deck);
    }
  });
  tools.append(stat,bAgain,bShuf,bReset);tb.appendChild(tools);
  host.appendChild(tb);

  const realIdx=vis[st.i];
  const card=buildCard(deck,realIdx,st.i,vis.length);
  host.appendChild(card);
}

function buildCard(deck,idx,pos,total){
  const st=rt[deck];
  const id=cardId(deck,idx);
  const card=document.createElement("div");card.className="card";

  const meta=document.createElement("div");meta.className="card-meta";
  const ix=document.createElement("span");ix.className="idx";ix.textContent=`${pos+1} / ${total}`;
  meta.appendChild(ix);
  const stt=getState(id);
  if(stt){const bd=document.createElement("span");bd.className="state-badge "+(stt==="ok"?"ok":"again");
    bd.textContent=stt==="ok"?"会了":"再练";meta.appendChild(bd);}
  card.appendChild(meta);

  if(deck==="koujue")   buildKoujueFront(card,idx,st.revealed);
  else if(deck==="qa")  buildQAFront(card,idx,st.revealed);
  else if(deck==="code")buildCodeFront(card,idx,st.revealed);
  else                  buildNumFront(card,idx,st.revealed);

  /* reveal toggle */
  const rb=document.createElement("button");rb.className="reveal-btn"+(st.revealed?" open":"");
  rb.textContent=st.revealed?"收起答案":"显示答案";
  rb.addEventListener("click",()=>{st.revealed=!st.revealed;renderDeck(deck);});
  card.appendChild(rb);

  const back=card.querySelector(".back");
  if(st.revealed&&back)back.classList.add("show");

  /* mark buttons (only after reveal) */
  if(st.revealed){
    const marks=document.createElement("div");marks.className="marks";
    const ok=document.createElement("button");ok.className="mk ok";ok.textContent="✓ 会了";
    ok.addEventListener("click",()=>{setState(id,"ok");goNext(deck);});
    const ag=document.createElement("button");ag.className="mk again";ag.textContent="↻ 再练";
    ag.addEventListener("click",()=>{setState(id,"again");goNext(deck);});
    marks.append(ok,ag);card.appendChild(marks);
  }

  /* nav */
  const nb=document.createElement("div");nb.className="navbar";
  const prev=document.createElement("button");prev.className="navbtn";prev.textContent="‹ 上一张";
  prev.disabled=pos===0;prev.addEventListener("click",()=>{if(st.i>0){st.i--;st.revealed=false;renderDeck(deck);}});
  const rand=document.createElement("button");rand.className="navbtn mid";rand.textContent="随机";
  rand.addEventListener("click",()=>{const v=visibleIndexes(deck);if(v.length>1){let j;do{j=Math.floor(Math.random()*v.length);}while(j===st.i);st.i=j;}st.revealed=false;renderDeck(deck);});
  const next=document.createElement("button");next.className="navbtn";next.textContent="下一张 ›";
  next.disabled=pos>=total-1;next.addEventListener("click",()=>goNext(deck));
  nb.append(prev,rand,next);card.appendChild(nb);
  return card;
}

function goNext(deck){
  const st=rt[deck];const total=visibleIndexes(deck).length;
  if(st.i<total-1){st.i++;st.revealed=false;renderDeck(deck);}
  else{st.revealed=false;renderDeck(deck);}
}

/* ---------- fronts ---------- */
function mnemonicBlock(fkey,revealAll){
  const f=F[fkey];
  const box=document.createElement("div");box.className="ku";
  const row=document.createElement("div");row.className="ku-row";
  const means=document.createElement("div");means.className="ku-means";
  f.chars.forEach((ch,i)=>{
    const btn=document.createElement("button");btn.className="ku-char";btn.type="button";
    btn.textContent=ch.c;btn.setAttribute("aria-expanded","false");
    const mrow=document.createElement("div");mrow.className="ku-mean";
    const b=document.createElement("b");b.textContent=ch.c;mrow.appendChild(b);
    mrow.appendChild(document.createTextNode(ch.m));
    means.appendChild(mrow);
    btn.addEventListener("click",()=>{
      const open=btn.getAttribute("aria-expanded")==="true";
      btn.setAttribute("aria-expanded",open?"false":"true");
      mrow.classList.toggle("show",!open);
    });
    row.appendChild(btn);
    if(i<f.chars.length-1){const d=document.createElement("span");d.className="ku-dot";d.textContent="·";row.appendChild(d);}
    if(revealAll){btn.setAttribute("aria-expanded","true");mrow.classList.add("show");}
  });
  box.appendChild(row);
  const hint=document.createElement("div");hint.className="ku-hint";hint.textContent="👆 点每个字，先自己回忆它代表什么，再看含义";
  box.appendChild(hint);
  box.appendChild(means);
  return box;
}

function buildKoujueFront(card,idx,revealed){
  const key=DECKS.koujue.keys[idx];const f=F[key];
  const h=document.createElement("div");h.className="qhead";h.textContent="口诀";
  const t=document.createElement("div");t.className="qtitle";t.textContent=f.tag;
  card.append(h,t);
  card.appendChild(mnemonicBlock(key,revealed));
  const back=document.createElement("div");back.className="back";
  back.append(labelEl("锚点串（背这条顺序）"),chainEl(f.chain),labelEl("一句话精髓"),chainEl(f.essence));
  card.appendChild(back);
}
function buildQAFront(card,idx,revealed){
  const item=QA[idx];const f=F[item.f];
  const h=document.createElement("div");h.className="qhead";h.textContent="面试问题（英文作答）";
  const t=document.createElement("div");t.className="qtitle";t.textContent=item.q;
  card.append(h,t);
  card.appendChild(mnemonicBlock(item.f,revealed));
  const back=document.createElement("div");back.className="back";
  back.appendChild(labelEl("要说的话（英文）"));
  const say=document.createElement("div");say.className="say";
  item.say.split("\n").forEach(pp=>say.appendChild(para(pp)));
  back.appendChild(say);
  if(item.tip){const tp=document.createElement("div");tp.className="tip";
    const b=document.createElement("b");b.textContent="提示 ";tp.appendChild(b);md(item.tip,tp);back.appendChild(tp);}
  card.appendChild(back);
}
function buildCodeFront(card,idx,revealed){
  const item=CODE[idx];
  const h=document.createElement("div");h.className="qhead";h.textContent="代码 · 先讲逻辑，能默写更好";
  const t=document.createElement("div");t.className="qtitle";t.textContent=item.title;
  card.append(h,t);
  const lg=document.createElement("div");lg.className="chain";lg.style.marginTop="12px";
  const b=document.createElement("b");b.className="nv";b.textContent="一句话逻辑：";lg.appendChild(b);
  lg.appendChild(document.createTextNode(item.logic));
  card.appendChild(lg);
  const back=document.createElement("div");back.className="back";
  back.appendChild(labelEl("代码"));
  const pre=document.createElement("pre");pre.className="code";pre.textContent=item.code;back.appendChild(pre);
  back.appendChild(labelEl("讲法"));
  back.appendChild(chainEl(item.explain));
  card.appendChild(back);
}
function buildNumFront(card,idx,revealed){
  const item=NUM[idx];
  const h=document.createElement("div");h.className="qhead";h.textContent="关键数字 · 目标秒答";
  const t=document.createElement("div");t.className="qtitle";t.textContent=item.q;
  card.append(h,t);
  const back=document.createElement("div");back.className="back";
  const a=document.createElement("div");a.className="chain";a.style.marginTop="4px";a.style.fontSize="16px";
  md(item.a,a);back.appendChild(a);
  card.appendChild(back);
}

function labelEl(txt){const d=document.createElement("div");d.className="lbl";d.textContent=txt;return d;}
function chainEl(txt){const d=document.createElement("div");d.className="chain";md(txt,d);return d;}

/* ---------- reference view ---------- */
function renderRef(){
  const host=document.getElementById("view-ref");
  if(host.dataset.built==="1")return;
  host.dataset.built="1";
  /* 必改 */
  const b1=details("⚠ 开工前必改 4 项（今晚第一件事）",true);
  const body1=b1.querySelector(".body");
  FIX.forEach(fx=>{
    const d=document.createElement("div");d.className="fix";
    const h=document.createElement("h4");const n=document.createElement("span");n.className="n";n.textContent=fx.n;
    h.appendChild(n);h.appendChild(document.createTextNode(fx.t));d.appendChild(h);
    d.appendChild(para(fx.body));
    if(fx.line){const s=document.createElement("div");s.className="sayline "+(fx.lineType||"plain");s.textContent=fx.line;d.appendChild(s);}
    if(fx.note){const p=para(fx.note);p.style.color="#6c6c78";p.style.fontSize="13.5px";d.appendChild(p);}
    body1.appendChild(d);
  });
  host.appendChild(b1);
  /* 金句 */
  const b2=details("5 句金句（任何题都能往这五句上收）",false);
  const ol=document.createElement("ol");ol.className="gold";
  GOLD.forEach(g=>{const li=document.createElement("li");li.innerHTML=g;ol.appendChild(li);});
  b2.querySelector(".body").appendChild(ol);host.appendChild(b2);
  /* 救场 */
  const b3=details("救场话术 + 反问 + 三原则",false);
  const bd=b3.querySelector(".body");
  const l1=labelEl("卡壳兜底句");bd.appendChild(l1);
  RESCUE.phrases.forEach(p=>{const d=document.createElement("div");d.className="resc";
    const w=document.createElement("div");w.className="when";w.textContent=p.when;
    const e=document.createElement("div");e.className="en";e.textContent=p.en;d.append(w,e);bd.appendChild(d);});
  const l2=labelEl("反问（面试最后问 1–2 个）");l2.style.marginTop="16px";bd.appendChild(l2);
  RESCUE.reverse.forEach(r=>{const d=document.createElement("div");d.className="rev-q";d.textContent=r;bd.appendChild(d);});
  const l3=labelEl("临场三原则");l3.style.marginTop="16px";bd.appendChild(l3);
  RESCUE.principles.forEach(pr=>{const d=document.createElement("div");d.className="prin";
    const k=document.createElement("div");k.className="k";k.textContent=pr.k;
    const v=document.createElement("div");v.className="v";v.textContent=pr.v;d.append(k,v);bd.appendChild(d);});
  host.appendChild(b3);
}
function details(summary,open){
  const d=document.createElement("details");d.className="refblock";if(open)d.open=true;
  const s=document.createElement("summary");s.appendChild(document.createTextNode(summary));
  const ch=document.createElement("span");ch.className="chev";ch.textContent="▸";s.appendChild(ch);
  const body=document.createElement("div");body.className="body";
  d.append(s,body);return d;
}

/* ---------- helpers ---------- */
function countState(deck,st){let c=0;deckItems(deck).forEach((_,i)=>{if(getState(cardId(deck,i))===st)c++;});return c;}
function shuffle(deck){
  /* permute display order only; progress stays keyed by stable index */
  const o=rt[deck].order;
  for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}
  rt[deck].i=0;rt[deck].revealed=false;
}
function updateGlobal(){
  let ok=0,all=0;
  ["koujue","qa","code","num"].forEach(dk=>{const n=deckItems(dk).length;all+=n;
    for(let i=0;i<n;i++)if(getState(cardId(dk,i))==="ok")ok++;});
  document.getElementById("pgOk").textContent=ok;
  document.getElementById("pgAll").textContent=all;
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(activeView==="ref")return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea")return;
  const deck=activeView,st=rt[deck],total=visibleIndexes(deck).length;
  if(e.key===" "){e.preventDefault(); if(!st.revealed){st.revealed=true;renderDeck(deck);} else goNext(deck);}
  else if(e.key==="ArrowRight"){e.preventDefault();goNext(deck);}
  else if(e.key==="ArrowLeft"){e.preventDefault();if(st.i>0){st.i--;st.revealed=false;renderDeck(deck);}}
  else if(e.key==="1"&&st.revealed){setState(cardId(deck,visibleIndexes(deck)[st.i]),"ok");goNext(deck);}
  else if(e.key==="2"&&st.revealed){setState(cardId(deck,visibleIndexes(deck)[st.i]),"again");goNext(deck);}
});

document.getElementById("warnChip").addEventListener("click",()=>switchView("ref"));

/* howto */
document.getElementById("howto").innerHTML=
  '桌面端快捷键：<kbd>空格</kbd> 显示答案/下一张 · <kbd>←</kbd><kbd>→</kbd> 翻卡 · <kbd>1</kbd> 会了 · <kbd>2</kbd> 再练　|　进度自动保存在本机（下载到本地打开时生效）';

/* init */
updateGlobal();
switchView("koujue");
</script>
